apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10

      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:5.0.9
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: state
              mountPath: /fluent-bit/state

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: state
          emptyDir: {}

      tolerations:
        - operator: Exists