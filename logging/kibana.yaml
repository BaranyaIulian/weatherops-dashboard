apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  replicas: 1

  strategy:
    type: Recreate

  progressDeadlineSeconds: 1200

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana

    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.4.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5601
              protocol: TCP

          env:
            - name: SERVER_HOST
              value: "0.0.0.0"

            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch.logging.svc.cluster.local:9200"]'

            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"

          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          startupProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120

          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  type: ClusterIP

  selector:
    app: kibana

  ports:
    - name: http
      protocol: TCP
      port: 5601
      targetPort: 5601