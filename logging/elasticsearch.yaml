apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: logging
  labels:
    app: elasticsearch
data:
  elasticsearch.yml: |
    cluster.name: weatherops-logging
    node.name: elasticsearch
    network.host: 0.0.0.0

    discovery.type: single-node

    xpack.security.enabled: false
    xpack.ml.enabled: false

    node.store.allow_mmap: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app: elasticsearch
spec:
  replicas: 1

  strategy:
    type: Recreate

  progressDeadlineSeconds: 1200

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP

            - name: transport
              containerPort: 9300
              protocol: TCP

          env:
            - name: ES_JAVA_OPTS
              value: "-Xms768m -Xmx768m"

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          startupProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: elasticsearch-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true

            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

      volumes:
        - name: elasticsearch-config
          configMap:
            name: elasticsearch-config

        - name: elasticsearch-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app: elasticsearch
spec:
  type: ClusterIP

  selector:
    app: elasticsearch

  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200

    - name: transport
      protocol: TCP
      port: 9300
      targetPort: 9300